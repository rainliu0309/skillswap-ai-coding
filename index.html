  <style>
    :root{--ink:#171933;--ink-2:#202246;--cream:#f7f5f0;--muted:#8d90aa;--line:rgba(255,255,255,.1);--coral:#ff765c;--yellow:#f6d36b;--mint:#79d7bb;--text:#252640}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--ink);color:var(--cream);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;letter-spacing:-.01em}body.modal-open{overflow:hidden}button,input,select{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{border-right:1px solid var(--line);padding:30px 22px;display:flex;flex-direction:column;gap:38px;min-height:100vh}.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;letter-spacing:-.04em}.logo{width:31px;height:31px;border-radius:10px;background:var(--coral);position:relative;display:grid;place-items:center;color:var(--ink);font-size:16px}.logo:after{content:'↔';font-weight:900}.nav{display:flex;flex-direction:column;gap:8px}.nav button{background:transparent;color:var(--muted);text-align:left;padding:13px 14px;border-radius:12px;font-size:14px;display:flex;gap:12px;align-items:center;transition:.18s}.nav button.active,.nav button:hover{background:rgba(255,255,255,.08);color:var(--cream)}.nav button.active{color:var(--yellow)}.nav i{font-style:normal;font-size:17px;width:20px;text-align:center}.sidebar-bottom{margin-top:auto}.profile-mini{display:flex;gap:10px;align-items:center;padding-top:20px;border-top:1px solid var(--line)}.avatar{width:34px;height:34px;border-radius:50%;background:#f4bf9e;color:var(--ink);display:grid;place-items:center;font-size:12px;font-weight:800;flex:none}.profile-mini b{font-size:13px}.profile-mini span{display:block;color:var(--muted);font-size:11px;margin-top:2px}.main{padding:30px 42px 58px;max-width:1320px;width:100%;margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}.eyebrow{color:var(--coral);font-size:12px;text-transform:uppercase;letter-spacing:.16em;font-weight:800}.topbar h1{font-size:30px;margin:8px 0 0;letter-spacing:-.05em}.top-actions{display:flex;gap:12px;align-items:center}.icon-btn{background:transparent;color:var(--cream);font-size:20px;padding:10px;border-radius:10px;position:relative}.icon-btn:hover{background:rgba(255,255,255,.08)}.icon-btn:after{content:'';width:6px;height:6px;background:var(--coral);border-radius:50%;position:absolute;right:8px;top:7px}.primary{background:var(--coral);color:var(--ink);padding:12px 17px;border-radius:11px;font-weight:800;font-size:13px;transition:.2s}.primary:hover{transform:translateY(-1px);filter:brightness(1.08)}.secondary{background:rgba(255,255,255,.08);color:var(--cream);padding:11px 15px;border-radius:11px;font-weight:700;font-size:13px}.secondary:hover{background:rgba(255,255,255,.13)}.hero{background:linear-gradient(118deg,#242751 0%,#22234a 65%,#30274d 100%);border-radius:22px;padding:29px 31px;display:flex;justify-content:space-between;align-items:center;min-height:168px;position:relative;overflow:hidden}.hero:after{content:'↔';position:absolute;right:44px;bottom:-39px;color:rgba(255,255,255,.07);font-size:174px;font-weight:900;line-height:1}.hero h2{margin:8px 0 9px;font-size:27px;letter-spacing:-.05em;max-width:530px}.hero p{margin:0;color:#b5b7cc;font-size:14px}.hero-copy{position:relative;z-index:1}.hero .primary{margin-top:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:17px 0 32px}.stat{background:var(--ink-2);border:1px solid var(--line);border-radius:15px;padding:18px 19px}.stat .num{font-size:24px;font-weight:800;letter-spacing:-.05em}.stat label{display:block;color:var(--muted);font-size:12px;margin-top:5px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.section-head h3{font-size:18px;margin:0;letter-spacing:-.04em}.section-head a{font-size:12px;color:var(--yellow);text-decoration:none}.search-row{display:flex;gap:10px;margin-bottom:18px}.search{flex:1;position:relative}.search input{width:100%;background:var(--ink-2);border:1px solid var(--line);border-radius:12px;padding:13px 16px 13px 42px;color:var(--cream);outline:none;font-size:14px;min-height:44px}.search input:focus{border-color:rgba(246,211,107,.7);box-shadow:0 0 0 3px rgba(246,211,107,.08)}.search span{position:absolute;left:15px;top:10px;font-size:18px;color:var(--muted);pointer-events:none}.filter{background:var(--ink-2);color:var(--cream);border:1px solid var(--line);border-radius:12px;padding:0 15px;font-size:13px;min-height:44px;white-space:nowrap}.filter:hover{border-color:rgba(246,211,107,.5)}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:var(--cream);color:var(--ink);border-radius:17px;padding:18px;min-height:250px;display:flex;flex-direction:column;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(0,0,0,.18)}.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.person{display:flex;gap:10px;align-items:center;min-width:0}.person .avatar{width:37px;height:37px}.person b{font-size:14px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:125px}.person span{font-size:11px;color:#7d7e8e;display:block;margin-top:2px}.match{font-size:11px;color:#4c806f;background:#d9f1e6;padding:5px 8px;border-radius:20px;font-weight:800;white-space:nowrap}.card h4{font-size:19px;margin:21px 0 8px;letter-spacing:-.04em}.trade{display:flex;align-items:center;gap:7px;color:#656879;font-size:12px}.trade strong{color:var(--ink);font-weight:700}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:17px}.tag{background:#e8e7e1;border-radius:7px;padding:6px 8px;font-size:11px;color:#626477}.card .card-action{margin-top:auto;padding-top:18px;display:flex;justify-content:space-between;align-items:center;gap:8px}.time{color:#818290;font-size:11px}.outline{border:1px solid #c9cad0;background:transparent;color:var(--ink);padding:8px 11px;border-radius:9px;font-size:12px;font-weight:700;white-space:nowrap}.outline:hover{border-color:var(--ink);background:#fff}.outline.sent{background:#d9f1e6;border-color:#b3dfcf;color:#4c806f}.empty{grid-column:1/-1;color:var(--muted);background:var(--ink-2);border:1px dashed var(--line);border-radius:15px;padding:32px;text-align:center;font-size:14px}.view-shell{background:var(--ink-2);border:1px solid var(--line);border-radius:18px;padding:25px}.view-shell h2{font-size:22px;margin:0 0 7px;letter-spacing:-.04em}.view-shell>p{color:var(--muted);font-size:14px;margin:0 0 22px}.match-list,.history-list{display:grid;gap:10px}.match-row,.history-row{display:flex;align-items:center;justify-content:space-between;gap:15px;background:rgba(255,255,255,.05);border:1px solid var(--line);padding:14px;border-radius:13px}.row-main{display:flex;align-items:center;gap:11px;min-width:0}.row-main strong{font-size:14px;display:block}.row-main small{display:block;color:var(--muted);font-size:12px;margin-top:3px}.status{font-size:12px;color:var(--yellow);white-space:nowrap}.status.done{color:var(--mint)}.create-form{display:grid;gap:16px;max-width:680px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:7px}.field label{font-size:13px;color:#c9c9d6;font-weight:700}.field input,.field select{background:#171933;color:var(--cream);border:1px solid var(--line);border-radius:11px;padding:12px 13px;outline:none;min-height:44px}.field input:focus,.field select:focus{border-color:rgba(246,211,107,.7)}.form-note{color:var(--muted);font-size:12px;margin:0}.form-actions{display:flex;justify-content:flex-end;gap:10px;padding-top:3px}.toast{position:fixed;right:25px;bottom:25px;background:var(--yellow);color:var(--ink);padding:13px 17px;border-radius:12px;font-size:13px;font-weight:700;box-shadow:0 8px 30px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);transition:.25s;pointer-events:none;z-index:30}.toast.show{opacity:1;transform:translateY(0)}.modal-backdrop{position:fixed;inset:0;background:rgba(10,11,28,.72);display:grid;place-items:center;padding:20px;opacity:0;pointer-events:none;transition:.2s;z-index:20}.modal-backdrop.show{opacity:1;pointer-events:auto}.modal{background:var(--cream);color:var(--ink);width:min(520px,100%);border-radius:18px;padding:25px;box-shadow:0 25px 80px rgba(0,0,0,.35);transform:translateY(12px);transition:.2s}.modal-backdrop.show .modal{transform:translateY(0)}.modal-head{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.modal h2{font-size:21px;margin:0 0 6px;letter-spacing:-.04em}.modal p{color:#77798a;font-size:13px;margin:0 0 20px}.modal-close{background:#ebe9e3;color:#5d5e6a;border-radius:9px;width:32px;height:32px;font-size:20px;line-height:1}.modal .field label{color:#5d5e6a}.modal .field input,.modal .field select{background:#fff;border-color:#d7d6d0;color:var(--ink)}.invite-person{display:flex;gap:12px;align-items:center;padding:14px;background:#ebe9e3;border-radius:12px;margin-bottom:16px}.invite-person strong{font-size:14px;display:block}.invite-person span{font-size:12px;color:#747684;display:block;margin-top:3px}.modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:21px}.modal .secondary{background:#ebe9e3;color:var(--ink)}
    @media(max-width:980px){.app{grid-template-columns:76px 1fr}.sidebar{padding:25px 12px}.brand span,.nav button span,.profile-mini div{display:none}.brand{justify-content:center}.nav button{justify-content:center;padding:13px 0}.profile-mini{justify-content:center}.main{padding:26px 24px}.cards{grid-template-columns:repeat(2,1fr)}}
    @media(max-width:680px){.app{display:block}.sidebar{height:66px;min-height:66px;position:sticky;top:0;z-index:5;background:var(--ink);padding:0 14px;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;align-items:center;gap:10px}.brand{margin-right:auto}.nav{flex-direction:row;gap:2px}.nav button{padding:9px;width:39px;height:39px}.sidebar-bottom{display:none}.main{padding:24px 16px 40px}.topbar{margin-bottom:22px;align-items:flex-start}.eyebrow{font-size:10px}.topbar h1{font-size:25px}.top-actions .icon-btn{display:none}.top-actions .primary{padding:10px 12px;font-size:12px}.hero{padding:24px 22px;min-height:214px;border-radius:18px}.hero h2{font-size:24px;max-width:275px}.hero p{line-height:1.6;max-width:255px}.hero:after{right:-4px;font-size:120px}.stats{gap:8px;margin:14px 0 28px}.stat{padding:14px 12px}.stat .num{font-size:20px}.stat label{font-size:11px;line-height:1.35}.cards{grid-template-columns:1fr}.search-row{flex-direction:column}.filter{width:100%}.section-head h3{font-size:17px}.view-shell{padding:19px}.form-grid{grid-template-columns:1fr}.match-row,.history-row{align-items:flex-start;flex-direction:column;gap:9px}.match-row .primary,.history-row .status{align-self:flex-end}.toast{left:16px;right:16px;bottom:16px;text-align:center}.modal{padding:20px}.modal-actions{flex-direction:column-reverse}.modal-actions button{width:100%}}
    @media(max-width:390px){.brand span{display:none}.nav button{width:36px}.top-actions .primary{font-size:11px;padding:9px 10px}.topbar h1{font-size:22px}.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.hero h2{font-size:22px}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><div class="logo"></div><span>SkillSwap</span></div>
      <nav class="nav" aria-label="主导航">
        <button class="active" data-view="discover" title="发现技能"><i>⌂</i><span>发现技能</span></button>
        <button data-view="matches" title="我的匹配"><i>✦</i><span>我的匹配</span></button>
        <button data-view="create" title="发布技能"><i>＋</i><span>发布技能</span></button>
        <button data-view="history" title="交换记录"><i>◫</i><span>交换记录</span></button>
      </nav>
      <div class="sidebar-bottom"><div class="profile-mini"><div class="avatar">林</div><div><b>林小满</b><span>交换达人 · Lv.3</span></div></div></div>
    </aside>
    <main class="main">
      <header class="topbar"><div><div class="eyebrow" id="pageEyebrow">Thursday, 19 September</div><h1 id="pageTitle">你好，小满 ✦</h1></div><div class="top-actions"><button class="icon-btn" data-action="notify" aria-label="查看通知">♧</button><button class="primary" data-action="open-create">＋ 发布我的技能</button></div></header>
      <div id="view"></div>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="modal-backdrop" id="modalBackdrop" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div id="modalContent"></div></section></div>
  <script>
    const seedPeople=[
      {id:'zhou',name:'周予安',city:'上海 · 2km',initial:'周',bg:'#b8d9df',teach:'人像摄影',learn:'尤克里里',tags:['自然光','手机摄影'],time:'周末有空',match:'98%',mode:'线下'},
      {id:'kai',name:'阿凯',city:'上海 · 4km',initial:'凯',bg:'#f0c18d',teach:'Python 入门',learn:'日语会话',tags:['数据分析','自动化'],time:'工作日晚上',match:'94%',mode:'线上'},
      {id:'mia',name:'Mia',city:'上海 · 7km',initial:'M',bg:'#c9b7dc',teach:'吉他弹唱',learn:'平面设计',tags:['民谣','指弹'],time:'灵活安排',match:'91%',mode:'线下'},
      {id:'chen',name:'陈小满',city:'上海 · 9km',initial:'陈',bg:'#b8d5ac',teach:'烘焙甜点',learn:'视频剪辑',tags:['法式甜点','裱花'],time:'周六下午',match:'88%',mode:'线下'}
    ];
    const state={view:'discover',query:'',filter:'全部',people:[...seedPeople],invites:{}};
    const $=s=>document.querySelector(s);
    function read(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
    function save(key,value){try{localStorage.setItem(key,JSON.stringify(value))}catch{}}
    state.invites=read('skillswap-invites',{});
    const savedPeople=read('skillswap-my-skills',[]);if(Array.isArray(savedPeople))state.people=[...savedPeople,...state.people];
    function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}
    function setActive(view){document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view))}
    function card(person){const sent=state.invites[person.id];return `<article class="card"><div class="card-top"><div class="person"><div class="avatar" style="background:${person.bg}">${person.initial}</div><div><b>${person.name}</b><span>${person.city}</span></div></div><span class="match">${person.match} 匹配</span></div><h4>${person.teach}</h4><div class="trade">想交换 <strong>↔ ${person.learn}</strong></div><div class="tags">${person.tags.map(t=>`<span class="tag">${t}</span>`).join('')}<span class="tag">${person.mode}</span></div><div class="card-action"><span class="time">◷ ${person.time}</span><button class="outline ${sent?'sent':''}" data-action="invite" data-id="${person.id}">${sent?'已发邀请':'发起交换'}</button></div></article>`}
    function filteredPeople(){const q=state.query.trim().toLowerCase();return state.people.filter(p=>(!q||(p.teach+p.learn+p.name+p.tags.join('')).toLowerCase().includes(q))&&(state.filter==='全部'||p.mode===state.filter))}
    function discover(){const list=filteredPeople();return `<section class="hero"><div class="hero-copy"><div class="eyebrow" style="color:var(--yellow)">本周互换提案</div><h2>用你会的，换你想学的。</h2><p>附近有 128 位同频的人，正在寻找像你一样的技能伙伴。</p><button class="primary" data-action="start">开始匹配 →</button></div></section><section class="stats"><div class="stat"><div class="num">${12+Object.keys(state.invites).length}</div><label>已完成交换</label></div><div class="stat"><div class="num">4.9 <span style="font-size:14px;color:var(--yellow)">★</span></div><label>社区口碑</label></div><div class="stat"><div class="num">86%</div><label>本周匹配成功率</label></div></section><section><div class="section-head"><h3>为你找到的匹配</h3><a href="#" data-action="all">查看全部  →</a></div><div class="search-row"><div class="search"><span>⌕</span><input id="search" value="${state.query.replace(/"/g,'&quot;')}" aria-label="搜索技能" placeholder="搜索你想学的技能，如：摄影、吉他…" /></div><button class="filter" data-action="filter">筛选：${state.filter}⌄</button></div><div class="cards">${list.length?list.map(card).join(''):'<div class="empty">暂时没有找到匹配，试试别的关键词或切换筛选条件？</div>'}</div></section>`}
    function matches(){const entries=Object.keys(state.invites).map(id=>state.people.find(p=>p.id===id)).filter(Boolean);return `<section class="view-shell"><h2>我的匹配</h2><p>这里会保留你发出的交换邀请，方便继续跟进。</p><div class="match-list">${entries.length?entries.map(p=>`<div class="match-row"><div class="row-main"><div class="avatar" style="background:${p.bg}">${p.initial}</div><div><strong>${p.name} · ${p.teach}</strong><small>你想学：${p.learn} · ${p.mode}</small></div></div><span class="status">等待回复</span></div>`).join(''):'<div class="empty">还没有发出邀请，去发现技能认识新伙伴吧。</div>'}</div></section>`}
    function createForm(inModal=false){return `<form class="create-form" id="${inModal?'modalCreateForm':'createForm'}"><div class="form-grid"><div class="field"><label for="teach">我能教</label><input id="teach" name="teach" required placeholder="例如：人像摄影" /></div><div class="field"><label for="learn">我想学</label><input id="learn" name="learn" required placeholder="例如：尤克里里" /></div></div><div class="form-grid"><div class="field"><label for="mode">交换方式</label><select id="mode" name="mode"><option>线下</option><option>线上</option><option>都可以</option></select></div><div class="field"><label for="time">可交换时间</label><input id="time" name="time" required placeholder="例如：周末下午" /></div></div><div class="field"><label for="tags">技能标签 <span style="font-weight:400;color:var(--muted)">（用逗号分隔）</span></label><input id="tags" name="tags" placeholder="例如：自然光, 手机摄影" /></div><p class="form-note">发布后，匹配到相关技能的用户就能看到你的交换提案。</p><div class="form-actions">${inModal?'<button type="button" class="secondary" data-action="close-modal">取消</button>':''}<button type="submit" class="primary">发布交换提案</button></div></form>`}
    function history(){return `<section class="view-shell"><h2>交换记录</h2><p>每一次交换，都是把“会”变成“会更多”。</p><div class="history-list"><div class="history-row"><div class="row-main"><div class="avatar" style="background:#b8d9df">周</div><div><strong>人像摄影 ↔ 尤克里里</strong><small>与周予安 · 2026.09.12</small></div></div><span class="status done">已完成</span></div><div class="history-row"><div class="row-main"><div class="avatar" style="background:#f0c18d">凯</div><div><strong>Python 入门 ↔ 日语会话</strong><small>与阿凯 · 2026.08.28</small></div></div><span class="status done">已完成</span></div><div class="history-row"><div class="row-main"><div class="avatar" style="background:#c9b7dc">M</div><div><strong>平面设计 ↔ 吉他弹唱</strong><small>与 Mia · 2026.08.11</small></div></div><span class="status done">已完成</span></div></div></section>`}
    function render(){setActive(state.view);const titles={discover:['Thursday, 19 September','你好，小满 ✦'],matches:['你的交换进度','我的匹配'],create:['分享你的技能','发布技能'],history:['一起学过的事','交换记录']};$('#pageEyebrow').textContent=titles[state.view][0];$('#pageTitle').textContent=titles[state.view][1];$('#view').innerHTML=state.view==='discover'?discover():state.view==='matches'?matches():state.view==='create'?`<section class="view-shell"><h2>发布一个交换提案</h2><p>告诉社区你能教什么，也告诉大家你想学什么。</p>${createForm(false)}</section>`:history();const search=$('#search');if(search){search.addEventListener('input',e=>{state.query=e.target.value;render();const next=$('#search');next.focus();next.setSelectionRange(next.value.length,next.value.length)})}const form=$('#createForm');if(form)form.addEventListener('submit',submitCreate)}
    function openModal(content){$('#modalContent').innerHTML=content;$('#modalBackdrop').classList.add('show');document.body.classList.add('modal-open')}
    function closeModal(){$('#modalBackdrop').classList.remove('show');document.body.classList.remove('modal-open')}
    function openInvite(id){const p=state.people.find(x=>x.id===id);if(!p)return;openModal(`<div class="modal-head"><div><h2 id="modalTitle">发起交换邀请</h2><p>给对方留一句话，让交换从具体的兴趣开始。</p></div><button class="modal-close" data-action="close-modal" aria-label="关闭">×</button></div><div class="invite-person"><div class="avatar" style="background:${p.bg}">${p.initial}</div><div><strong>${p.name} · ${p.teach}</strong><span>想交换：${p.learn} · ${p.mode}</span></div></div><div class="field"><label for="message">邀请留言</label><input id="message" value="你好！我很想学${p.teach}，可以用${p.learn}和你交换吗？" /></div><div class="modal-actions"><button class="secondary" data-action="close-modal">先不发</button><button class="primary" data-action="confirm-invite" data-id="${id}">发送邀请</button></div>`)}
    function openCreate(){openModal(`<div class="modal-head"><div><h2 id="modalTitle">发布我的技能</h2><p>把你会的分享出去，也写下你想学的下一件事。</p></div><button class="modal-close" data-action="close-modal" aria-label="关闭">×</button></div>${createForm(true)}`);$('#modalCreateForm').addEventListener('submit',submitCreate)}
    function submitCreate(e){e.preventDefault();const form=e.currentTarget;const data=new FormData(form);const tags=String(data.get('tags')||'').split(',').map(x=>x.trim()).filter(Boolean).slice(0,3);const person={id:'mine-'+Date.now(),name:'林小满',city:'上海 · 你',initial:'林',bg:'#f4bf9e',teach:String(data.get('teach')).trim(),learn:String(data.get('learn')).trim(),tags:tags.length?tags:['技能交换'],time:String(data.get('time')).trim(),match:'你的技能',mode:String(data.get('mode'))};state.people.unshift(person);save('skillswap-my-skills',state.people.filter(p=>p.id.startsWith('mine-')));closeModal();state.view='discover';state.query='';render();toast('交换提案已发布，等一个刚好需要你的人 ✦')}
    document.addEventListener('click',e=>{const trigger=e.target.closest('[data-action],[data-view]');if(!trigger)return;const action=trigger.dataset.action||'nav';if(action==='nav'){state.view=trigger.dataset.view;render()}if(action==='open-create'){openCreate()}if(action==='close-modal'){closeModal()}if(action==='invite'){openInvite(trigger.dataset.id)}if(action==='confirm-invite'){state.invites[trigger.dataset.id]={status:'pending',created:Date.now()};save('skillswap-invites',state.invites);closeModal();render();toast('已发送交换邀请，对方会尽快回复你 ✦')}if(action==='filter'){const modes=['全部','线下','线上'];state.filter=modes[(modes.indexOf(state.filter)+1)%modes.length];render()}if(action==='all'){e.preventDefault();state.query='';state.filter='全部';render()}if(action==='start'){state.view='discover';render();setTimeout(()=>$('#search')?.focus(),0)}if(action==='notify'){toast('你有 1 条新通知：有人收藏了你的技能 ✦')}});
    $('#modalBackdrop').addEventListener('click',e=>{if(e.target.id==='modalBackdrop')closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
  </script>
</body>
</html>
